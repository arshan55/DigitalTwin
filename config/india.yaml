# ========================================================
# India Air Quality & Climate Digital Twin - All-India Full Scale
# ========================================================

project:
  name: "India Air Quality & Climate Digital Twin (Full Scale)"
  version: "1.0.0"
  random_seed: 42

spatial:
  domain_name: "all_india_high_res"
  bbox: [68.0, 6.0, 97.5, 37.5]
  resolution_deg: 0.1
  crs: "EPSG:4326"

temporal:
  start_date: "2020-01-01"
  end_date: "2023-12-31"
  timestep: "daily"

data_paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  sample: "data/sample"
  reports: "reports"

ingestion:
  use_sample_data: false
  tropomi:
    variables: ["NO2", "CO", "SO2", "O3", "HCHO"]
    qa_threshold: 0.5
    max_cloud_fraction: 0.3
  modis:
    products: ["MCD19A2", "MOD11A1", "MOD13A2"]
  merra2:
    collection: "M2T1NXAER"
    variables: ["PM25_RH35", "TOTEXTTAU", "BCEXTTAU", "OCEXTTAU", "DUEXTTAU", "SUEXTTAU"]
  era5:
    variables:
      - "2m_temperature"
      - "2m_dewpoint_temperature"
      - "10m_u_component_of_wind"
      - "10m_v_component_of_wind"
      - "surface_pressure"
      - "total_precipitation"
      - "boundary_layer_height"
  cpcb:
    target_pollutant: "PM2.5"
    auxiliary_pollutants: ["PM10", "NO2", "SO2", "CO", "O3"]
  viirs:
    confidence_min: "nominal"
    buffer_radii_km: [25, 50, 100, 200]
